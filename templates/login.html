{% extends 'base.html' %}{% block content %}<section class="auth"><p class="eyebrow">Личный доступ</p><h1>Рады видеть.</h1><p class="muted">Войдите, чтобы подключить устройство и получить профиль.</p>{% if error %}<p class="notice danger">Логин или пароль не подошёл.</p>{% endif %}<form method="post" action="/login" class="stack"><input type="hidden" name="csrf" value="{{csrf}}"><label>Логин<input name="login" required maxlength="32" autocomplete="username" autocapitalize="none"></label><label>Пароль<input type="password" name="password" required maxlength="256" autocomplete="current-password"></label><button type="submit">Войти <span>↗</span></button></form><p class="hint">Нет доступа? Попросите владельца прислать приглашение.</p></section>{% endblock %}
